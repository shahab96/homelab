deploymentMode: SingleBinary

global:
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: RUSTFS_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: rustfs-credentials
          key: accesskey
    - name: RUSTFS_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: rustfs-credentials
          key: secretkey

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: blob.dogar.dev
      region: us-east-1
      accessKeyId: ${RUSTFS_ACCESS_KEY}
      secretAccessKey: ${RUSTFS_SECRET_KEY}
      s3ForcePathStyle: true
      insecure: false
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 744h
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: s3

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn
    size: 10Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-operator
